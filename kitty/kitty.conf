font_family JetBrains Mono
bold_font auto
italic_font auto
bold_italic_font auto

font_size 11.0

background_opacity 0.7

background #000000
foreground #e8e8e8

selection_background #e8e8e8
selection_foreground #000000

cursor #e8e8e8
